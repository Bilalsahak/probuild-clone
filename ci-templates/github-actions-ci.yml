# TEMPLATE: copy to .github/workflows/ci.yml (needs a token/user with workflow permission to add it).
name: CI

# Builds the site on every pull request and push to main, runs lint and the
# forbidden-claims check. It does NOT deploy: production is deployed by
# Cloudflare Workers Builds (see README "Deploying").
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:forbidden
      - uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          retention-days: 7
